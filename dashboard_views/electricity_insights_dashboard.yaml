title: Electricity Insights
views:
  - title: Daily
    path: daily
    icon: mdi:calendar-today
    cards:
      - type: sensor
        entity: sensor.electricity_consumption_daily_tarif1_kwh_total
        name: "Daily Consumption Tariff"
        graph: line
        detail: 1
        unit_of_measurement: kWh
      - type: sensor
        entity: sensor.electricity_cost_daily_tarif1_eur_total
        name: "Daily Cost Tariff"
        graph: line
        detail: 1
        unit_of_measurement: €
        state_display: "{{ states('sensor.electricity_cost_daily_tarif1_eur_total') | float(0) | round(2) }}"

      - type: entities
        title: All Daily Electricity Metrics
        entities:
          - entity: sensor.electricity_consumption_daily_tarif1_kwh_total
          - entity: sensor.electricity_cost_daily_tarif1_eur_total
            format: "round(2)"

      - type: statistics-graph
        entities:
          - sensor.electricity_consumption_daily_tarif1_kwh_total
        chart_type: bar
        period: day
        stat_type: sum
        title: Daily kWh Usage History

      - type: statistics-graph
        entities:
          - sensor.electricity_cost_daily_tarif1_eur_total
        chart_type: bar
        period: day
        stat_type: sum
        title: Daily Cost History


  - title: Weekly
    path: weekly
    icon: mdi:calendar-week
    cards:
      - type: sensor
        entity: sensor.electricity_consumption_weekly_tarif1_kwh_total
        name: "Weekly Consumption"
        graph: line
        detail: 1
        unit_of_measurement: kWh
      - type: sensor
        entity: sensor.electricity_cost_weekly_tarif1_eur_total
        name: "Weekly Cost Tariff"
        graph: line
        detail: 1
        unit_of_measurement: €
        state_display: "{{ states('sensor.electricity_cost_weekly_tarif1_eur_total') | float(0) | round(2) }}"

      - type: entities
        title: All Weekly Electricity Metrics
        entities:
          - sensor.electricity_consumption_weekly_tarif1_kwh_total
          - sensor.electricity_cost_weekly_tarif1_eur_total

      - type: statistics-graph
        entities:
          - sensor.electricity_consumption_weekly_tarif1_kwh_total
        chart_type: bar
        period: week
        stat_type: sum
        title: Weekly kWh Usage History

      - type: statistics-graph
        entities:
          - sensor.electricity_cost_weekly_tarif1_eur_total
        chart_type: bar
        period: week
        stat_type: sum
        title: Weekly Cost History

  - title: Monthly
    path: monthly
    icon: mdi:calendar-month
    cards:
      - type: sensor
        entity: sensor.electricity_consumption_monthly_tarif1_kwh_total
