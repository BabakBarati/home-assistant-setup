- sensor:
    - name: "Current Electricity Price Vattenfall"
      unique_id: current_electricity_price_vattenfall
      unit_of_measurement: "EUR/kWh"
      state_class: "measurement"
      device_class: "monetary"
      state: >
        {% set now = now() %}
        {% set month = now.month %}
        {% set hour = now.hour %}
        {% set weekday = now.weekday() %}
        {% set is_public_holiday_or_weekend = is_state('binary_sensor.is_workday_nl', 'off') %}

        {% if month >= 4 and month <= 9 %}
          {% if (hour >= 0 and hour < 12) or (hour >= 16 and hour < 24) %}
            0.280405
          {% elif hour >= 12 and hour < 16 and weekday >= 0 and weekday <= 4 and not is_public_holiday_or_weekend %}
            0.162430
          {% elif hour >= 12 and hour < 16 and is_public_holiday_or_weekend %}
            0.122863
          {% else %}
            0.0
          {% endif %}
        {% else %}
          {% if (hour >= 6 and hour < 12) or (hour >= 16 and hour < 25) %}
            0.306662
          {% elif hour >= 12 and hour < 16 %}
            0.249671
          {% elif hour >= 1 and hour < 6 %}
            0.233457
          {% else %}
            0.0
          {% endif %}
