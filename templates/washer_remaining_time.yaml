- trigger:
    - platform: time_pattern
      minutes: "/1"
  sensor:
    - name: "Washer Remaining Time"
      unique_id: washer_remaining_time
      state: >
        {% set completion_time_str = states('sensor.washer_completion_time') %}
        {% if completion_time_str in ['unavailable', 'unknown', 'none'] or not completion_time_str %}
          unknown
        {% else %}
          {% set completion_time = strptime(completion_time_str, '%Y-%m-%dT%H:%M:%S%z') %}
          {% set now_utc = utcnow() %}
          {% if not completion_time %}
            unknown
          {% elif completion_time < now_utc %}
            00:00
          {% else %}
            {% set time_diff = (completion_time - now_utc).total_seconds() | int %}
            {% set hours = (time_diff // 3600) | int %}
            {% set minutes = ((time_diff % 3600) // 60) | int %}
            {{ '%02d:%02d' % (hours, minutes) }}
          {% endif %}
        {% endif %}

